<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Dream Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <!-- ═══════════════════════════════════════
         NAVBAR
    ════════════════════════════════════════ -->
  <header class="nav" role="banner">
    <a href="index.html" class="nav__logo" aria-label="Dream Cup — voltar para a página inicial">
      Dream Cup
    </a>
  </header>

  <main id="main-content" class="auth-page">
    <div class="auth-card">

      <!-- Abas -->
      <div class="auth-tabs" role="tablist" aria-label="Modo de acesso">
        <button class="auth-tab auth-tab--active" role="tab" id="tab-login" aria-selected="true"
          aria-controls="panel-login">Entrar</button>
        <button class="auth-tab" role="tab" id="tab-register" aria-selected="false" aria-controls="panel-register">Criar
          conta</button>
      </div>

      <!-- ═══ PAINEL LOGIN ═══ -->
      <div class="auth-panel" role="tabpanel" id="panel-login" aria-labelledby="tab-login">
        <h1 class="auth-card__title">Bem-vindo de volta</h1>
        <p class="auth-card__subtitle">Entre na sua conta para continuar jogando</p>

        <form class="auth-form" id="form-login" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="login-username">Usuário</label>
            <input class="auth-input" type="text" id="login-username" name="username" autocomplete="username"
              placeholder="Digite seu usuário..." required aria-required="true"
              aria-describedby="login-username-error" />
            <span class="auth-error" id="login-username-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="login-password">Senha</label>
            <div class="auth-input-wrapper">
              <input class="auth-input" type="password" id="login-password" name="password"
                autocomplete="current-password" placeholder="••••••••" required aria-required="true"
                aria-describedby="login-password-error" />
              <button type="button" class="auth-input__toggle-pw" aria-label="Mostrar senha" aria-pressed="false"
                data-target="login-password">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="auth-error" id="login-password-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="auth-forgot-row">
            <button type="button" class="auth-forgot" id="btn-forgot" aria-label="Esqueci minha senha">Esqueci minha
              senha</button>
          </div>

          <span class="auth-error auth-error--form" id="login-form-error" role="alert" aria-live="polite"></span>

          <button type="submit" class="auth-submit" id="btn-login">
            <span class="auth-submit__label">Entrar</span>
            <span class="auth-submit__spinner" aria-hidden="true"></span>
          </button>
          <button type="button" class="auth-submit auth-submit--outline" onclick="mockLogin()">
            <span class="auth-submit__label">Entrar com Demo</span>
          </button>
        </form>

        <p class="auth-switch">
          Não tem uma conta?
          <button type="button" class="auth-switch__link" data-tab="register">Criar conta</button>
        </p>
      </div>

      <!-- ═══ PAINEL CADASTRO ═══ -->
      <div class="auth-panel auth-panel--hidden" role="tabpanel" id="panel-register" aria-labelledby="tab-register"
        hidden>
        <h1 class="auth-card__title">Crie sua conta</h1>
        <p class="auth-card__subtitle">Monte sua seleção dos sonhos</p>

        <form class="auth-form" id="form-register" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="register-username">Usuário</label>
            <input class="auth-input" type="text" id="register-username" name="username" autocomplete="username"
              placeholder="Crie seu usuário..." required aria-required="true"
              aria-describedby="register-username-error" />
            <span class="auth-error" id="register-username-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="register-password">Senha</label>
            <div class="auth-input-wrapper">
              <input class="auth-input" type="password" id="register-password" name="password"
                autocomplete="new-password" placeholder="Mínimo 6 caracteres" required aria-required="true"
                aria-describedby="register-password-error" />
              <button type="button" class="auth-input__toggle-pw" aria-label="Mostrar senha" aria-pressed="false"
                data-target="register-password">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="auth-error" id="register-password-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="register-confirm">Confirmar senha</label>
            <div class="auth-input-wrapper">
              <input class="auth-input" type="password" id="register-confirm" name="confirm" autocomplete="new-password"
                placeholder="Confirme sua senha" required aria-required="true"
                aria-describedby="register-confirm-error" />
              <button type="button" class="auth-input__toggle-pw" aria-label="Mostrar confirmação de senha"
                data-target="register-confirm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <span class="auth-error" id="register-confirm-error" role="alert" aria-live="polite"></span>
          </div>

          <span class="auth-error auth-error--form" id="register-form-error" role="alert" aria-live="polite"></span>

          <button type="submit" class="auth-submit" id="btn-register">
            <span class="auth-submit__label">Criar conta</span>
            <span class="auth-submit__spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-switch">
          Já tem uma conta?
          <button type="button" class="auth-switch__link" data-tab="login">Entrar</button>
        </p>
      </div>

      <!-- ═══ PAINEL ESQUECI SENHA ═══ -->
      <div class="auth-panel auth-panel--hidden" role="tabpanel" id="panel-forgot" hidden>
        <button type="button" class="auth-back" id="btn-back-forgot" aria-label="Voltar para login">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Voltar
        </button>

        <h1 class="auth-card__title">Esqueci minha senha</h1>
        <p class="auth-card__subtitle">Digite seu usuário e enviaremos as instruções de recuperação</p>

        <form class="auth-form" id="form-forgot" novalidate>
          <div class="auth-field">
            <label class="auth-label" for="forgot-username">Usuário</label>
            <input class="auth-input" type="text" id="forgot-username" name="username" autocomplete="username"
              placeholder="Digite seu usuário..." required aria-required="true"
              aria-describedby="forgot-username-error" />
            <span class="auth-error" id="forgot-username-error" role="alert" aria-live="polite"></span>
          </div>

          <span class="auth-error auth-error--form" id="forgot-form-error" role="alert" aria-live="polite"></span>

          <button type="submit" class="auth-submit" id="btn-forgot-submit">
            <span class="auth-submit__label">Enviar instruções</span>
            <span class="auth-submit__spinner" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Estado de sucesso -->
        <div class="auth-success" id="forgot-success" hidden>
          <div class="auth-success__icon" aria-hidden="true">✅</div>
          <p class="auth-success__text">Instruções enviadas! Verifique seu e-mail.</p>
          <button type="button" class="auth-switch__link" data-tab="login">Voltar para o login</button>
        </div>
      </div>

    </div>
  </main>

  <script src="js/accessibility.js"></script>
  <script src="js/admin-access.js"></script>
  <script src="js/api.js?v=cart"></script>
  <script src="js/auth.js?v=cart"></script>
  <script src="js/auth-ui.js?v=cart"></script>
  <script>document.addEventListener("DOMContentLoaded", initAccessibility);</script>
  <script src="js/notify.js"></script>
</body>

</html>
