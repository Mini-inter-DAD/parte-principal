<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado da Bola | Dream Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/accessibility.css" />
  <link rel="stylesheet" href="css/market.css?v=fill-missing-catalog-v1" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <header class="nav" role="banner">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo" aria-label="Dream Cup — voltar para a página inicial">Dream Cup</a>
      <div id="navbar" class="nav__links" aria-hidden="false"></div>
      <div class="nav__actions" id="nav-actions">
        <button class="nav__cart" type="button" id="btn-cart-focus" aria-controls="cart-panel" aria-expanded="false"
          aria-label="Abrir carrinho">
          <span class="nav__cart-icon" aria-hidden="true">🛒</span>
          <span class="nav__cart-label">Carrinho</span>
          <span class="nav__cart-count" id="cart-count">0</span>
        </button>
        <div class="nav__coins" id="header-coins" aria-label="Saldo de coins">⚽ 0</div>
      </div>

      <aside class="cart-panel" id="cart-panel" aria-labelledby="cart-title" aria-hidden="true">
        <div class="cart-panel__header">
          <div>
            <span class="cart-panel__eyebrow">Sua seleção</span>
            <h2 id="cart-title">Carrinho</h2>
          </div>
          <button class="cart-panel__close" type="button" id="btn-close-cart" aria-label="Fechar carrinho">×</button>
        </div>

        <div class="cart-panel__items" id="cart-items" aria-live="polite"></div>

        <div class="cart-panel__summary">
          <div><span>Total</span><strong id="cart-total">⚽ 0</strong></div>
          <div><span>Seu saldo</span><strong id="cart-balance">⚽ 0</strong></div>
        </div>

        <div class="cart-panel__actions">
          <button class="btn cart-panel__clear" type="button" id="btn-clear-cart">Limpar</button>
          <button class="btn cart-panel__checkout" type="button" id="btn-checkout">Finalizar compra</button>
        </div>
      </aside>
    </div>
  </header>

  <main class="market-page" id="market-root">
    <section class="market-toolbar">
      <div class="filter-card" aria-label="Painel de filtros do Mercado da Bola">
        <div class="filter-card__header">
          <h2>Filtrar cartas</h2>
          <div class="filter-card__actions">
            <button class="btn btn-secondary" type="button" id="btn-clear-filters">Limpar filtros</button>
            <button class="btn btn-secondary filter-card__toggle" type="button" id="btn-toggle-filters"
              aria-controls="filter-fields" aria-expanded="true">
              <span class="filter-card__toggle-label">Ocultar filtros</span>
              <span class="filter-card__toggle-icon" aria-hidden="true">⌃</span>
            </button>
          </div>
        </div>

        <div class="filter-card__body" id="filter-fields">
          <div class="filter-grid">
          <label class="filter-field">
            <span>Buscar</span>
            <input type="search" id="filter-query" placeholder="Nome do jogador ou seleção"
              aria-label="Pesquisar jogador ou seleção" />
          </label>

          <label class="filter-field">
            <span>Seleção</span>
            <select id="filter-nation" aria-label="Filtrar por seleção">
              <option value="">Todas</option>
            </select>
          </label>

          <label class="filter-field">
            <span>Posição</span>
            <select id="filter-position" aria-label="Filtrar por posição">
              <option value="">Todas</option>
              <option value="Goleiro">Goleiro</option>
              <option value="Zagueiro">Zagueiro</option>
              <option value="Lateral">Lateral</option>
              <option value="Meia">Meia</option>
              <option value="Atacante">Atacante</option>
            </select>
          </label>

          <div class="filter-field filter-range">
            <span>OVR</span>
            <div class="range-row">
              <div>
                <label for="filter-ovr-min">Mín.</label>
                <input type="number" id="filter-ovr-min" min="60" max="99" value="60" aria-label="Pontuação mínima" />
              </div>
              <div>
                <label for="filter-ovr-max">Máx.</label>
                <input type="number" id="filter-ovr-max" min="60" max="99" value="99" aria-label="Pontuação máxima" />
              </div>
            </div>
          </div>

          <div class="filter-field filter-range">
            <span>Valor de Mercado</span>
            <div class="range-row">
              <div>
                <label for="filter-price-min">Mín.</label>
                <input type="number" id="filter-price-min" min="0" value="0" aria-label="Valor mínimo" />
              </div>
              <div>
                <label for="filter-price-max">Máx.</label>
                <input type="number" id="filter-price-max" min="0" value="999999" aria-label="Valor máximo" />
              </div>
            </div>
          </div>
          </div>
        </div>
      </div>
    </section>

    <div class="market-content">
      <section class="market-grid" id="player-grid" aria-live="polite"></section>

      <nav class="market-pagination" id="market-pagination" aria-label="Paginação do mercado" hidden>
        <button class="btn btn-secondary market-pagination__button" type="button" id="pagination-previous"
          aria-label="Ir para a página anterior">Anterior</button>
        <p class="market-pagination__status" id="pagination-status" aria-live="polite">Página 1 de 1</p>
        <button class="btn btn-secondary market-pagination__button" type="button" id="pagination-next"
          aria-label="Ir para a próxima página">Próxima</button>
      </nav>

    </div>
  </main>

  <script src="js/accessibility.js"></script>
  <script src="js/admin-access.js"></script>
  <script src="js/api.js?v=cart"></script>
  <script src="js/auth.js?v=cart"></script>
  <script src="js/navbar.js"></script>
  <script src="js/formatters.js?v=shared-coins-v1"></script>
  <script src="js/market.js?v=position-filter-v1"></script>
  <script>document.addEventListener("DOMContentLoaded", () => { initMarket(); initAccessibility(); });</script>
  <script src="js/notify.js"></script>
</body>

</html>
