services:
  postgres:
    image: postgres:17
    container_name: dreamcup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  app:
    build: .
    container_name: dreamcup-app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - dreamcup_pipeline_cache:/app/data/cache

volumes:
  postgres_data:
  dreamcup_pipeline_cache:
  dreamcup_output_cache:
